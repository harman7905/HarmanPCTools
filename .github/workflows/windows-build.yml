
name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore HarmanPCTools.sln

      - name: Build
        run: dotnet build HarmanPCTools.sln --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish
          HarmanPCTools/HarmanPCTools.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output dist/publish

      - uses: actions/upload-artifact@v4
        with:
          name: HarmanPCTools-win-x64
          path: dist/publish/HarmanPCTools.exe
